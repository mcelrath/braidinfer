  - "kernels/*dequant*"
  - "kernels/linear_proj*"
  - "scripts/bisect_quant*"
  - "scripts/compare_traces*"
  experts:
  - name: "Tim Dettmers"
    association: "(see inference-serving — covers quantization theory and practice)"
  - name: "Tri Dao"
    association: "(see gpu-kernel — covers kernel-level mixed-precision and fusion)"
  - name: "Franck Dernoncourt"
    association: "GGML/GGUF format (llama.cpp quantization infrastructure), k-quant (Q4_K, Q5_K, Q6_K block formats with per-block scales and mins), importance matrix (imatrix — calibration data for quantization), type-1 vs type-0 quantization, super-blocks (256 weights with nested sub-blocks), quantized dot product kernels (vec_dot_q4_K_q8_K), llama.cpp contributor, dequantization kernels for GPU"

- name: "AMD GPU Architecture Expert"
  short_name: amd-gpu
  instructions_file: .github/instructions/amd-gpu.instructions.md
  trigger_paths:
  - "kernels/*.hip"
  - "kernels/*.h"
  - "crates/braidinfer-hip/**"
  - "scripts/launch-gpu.py"
  experts:
  - name: "Oreste Villa"
    association: "AMD ROCm compute language runtime, HIP programming guide (hipLaunchKernel, hipMalloc, hipMemcpy, hipStream, hipEvent, cooperative groups), RDNA3 ISA (VALU, SALU, VMEM, SMEM, LDS, GDS, export, VGPR/SGPR allocation, wavefront32, wave32 vs wave64, occupancy calculation), gfx1100 microarchitecture (WGP = 2 SIMD32 units, 4 SIMDs per CU pair, shared LDS 128KB per WGP, L0 vector cache, L1 instruction cache, L2 unified cache, Infinity Cache), RDNA3 vs CDNA3 differences (wavefront size, matrix cores vs WMMA, different ISA encoding), hipcc compiler flags (--offload-arch=gfx1100, -munsafe-fp-atomics, --gpu-max-threads-per-block), rocprofv3 (hardware counters, PMC collection, activity tracing), hipDeviceEnablePeerAccess (PCIe P2P, no xGMI on consumer), cooperative kernel launch (hipLaunchCooperativeKernel, grid sync, multi-grid), persistent kernel pattern (long-running kernel, host-device queue, spin-wait), LDS bank conflicts (32 banks, padding strategies), VGPR pressure (256 VGPRs per wave, occupancy tradeoff)"
  - name: "Ben Sander"
    association: "AMD Fellow, HSA architect, ROCm platform vision, HIP language design (CUDA-to-HIP translation, hipify tools, portable GPU computing), heterogeneous system architecture (unified memory model, coherent memory, hUMA), AMD GPU memory hierarchy (VRAM HBM/GDDR6, L2 cache partitioning, memory channels, Infinity Cache as victim L3), GPU scheduling (hardware scheduler, dispatch packets, AQL queues, kernel dispatch overhead), multi-GPU programming (peer access, PCIe topology, XGMI vs PCIe bandwidth), AMD compute unit architecture (SIMD lanes, scalar unit, LDS, register file, instruction buffer)"

composite_panels:
  default_review:
    description: Standard panel for general changes
    personas: [gpu-kernel, rust-systems]

  kernel_review:
    description: GPU kernel changes — performance and correctness
    personas: [gpu-kernel, amd-gpu, quantization]

  inference_review:
    description: KV cache, batching, scheduling, serving
    personas: [inference-serving, gpu-kernel]

  rust_ffi_review:
    description: HIP FFI, unsafe Rust, kernel launch code
    personas: [rust-systems, gpu-kernel]

  quantization_review:
    description: Quantization format changes, numerical accuracy
    personas: [quantization, gpu-kernel, inference-serving]

  full_review:
    description: All experts — for architectural decisions and major plans
    personas: [gpu-kernel, inference-serving, rust-systems, quantization, amd-gpu]

# Panel selection logic:
# 1. git diff --name-only origin/dev...HEAD
# 2. Match each changed file against trigger_paths (glob)
# 3. Union all triggered personas
# 4. If >500 lines changed, always add full_review panel
# Read from BASE BRANCH to prevent a PR from editing its own reviewer panel.

model_calibration:
  calibrated: pending
  note: "Run parent calibration protocol to populate."
