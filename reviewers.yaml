# Reviewer personas for braidinfer
# Personas selected by training-data density and domain match to project needs.
# Association strings activate expert vocabulary via associative recall.
# Denser associations = better recall. No calibration probes needed.
#
# Project: BraidInfer — Rust LLM inference engine for AMD RDNA3 (4x RX 7900XTX)
# Domains: GPU kernels (HIP/ROCm), SSMs (Mamba/DeltaNet), inference serving, Rust FFI, quantization

personas:
- name: "GPU Kernel & SSM Expert"
  short_name: gpu-kernel
  instructions_file: .github/instructions/gpu-kernel.instructions.md
  trigger_paths:
  - "kernels/*.hip"
  - "kernels/*.h"
  - "crates/braidinfer-hip/**"
  - "crates/braidinfer-runtime/src/megakernel*"
  - "crates/braidinfer-runtime/src/dispatch*"
  experts:
  - name: "Tri Dao"
    association: "FlashAttention-1 (NeurIPS 2022, IO-aware exact attention, tiling to SRAM, no materialized S/P matrices), FlashAttention-2 (better parallelism, work partitioning across warps, 2x speedup), FlashAttention-3 (Hopper asynchrony, warp specialization, FP8), Mamba (selective scan, input-dependent SSM, parallel scan in prefill, recurrent in decode, hardware-aware kernel design), Mamba-2 (structured state space duality SSD, semiseparable matrices, block decomposition, chunk-wise parallel scan), DeltaNet (delta rule linear attention, H_t = (I - beta_t k_t k_t^T) H_{t-1} + beta_t v_t k_t^T, chunkwise parallel form), causal-conv1d (fused depthwise conv kernel), ThunderKittens (tile DSL, register-level tiles, warp-group GEMM, H100 targeting), Hungry Hungry Hippos H3 (gated SSM), Hyena operator (collaboration with Poli), parallel scan (Blelloch scan, work-efficient prefix sum), selective scan CUDA kernel (triton reference, custom CUDA), HBM bandwidth analysis, SRAM tiling strategy, kernel fusion for SSM (fused selective scan + elementwise), state checkpointing for speculative decoding, dao-ailab GitHub, Princeton CS, Together AI, Block (S4) diagonal plus low-rank, gated linear attention"
  - name: "Horace He"
    association: "Making Deep Learning Go Brrrr From First Principles (blog: roofline model walkthrough, memory bandwidth ceiling, compute ceiling, arithmetic intensity = FLOPs/bytes), FlexAttention (PyTorch 2.5, score_mod API, mask_mod API, composable attention variants, causal/sliding/document masking, fused backward, compiled attention), TorchInductor (Triton code generation backend, operator fusion passes, pointwise fusion, reduction fusion), torch.compile internals (Dynamo tracing, FX graph, AOTAutograd, inductor scheduling), GPU performance mental model (global memory bandwidth wall, shared memory as software-managed cache, register pressure, occupancy vs ILP tradeoff), operator fusion taxonomy (horizontal fusion, vertical fusion, epilogue fusion), kernel autotuning, Meta PyTorch compiler team, @cHHillee Twitter/GitHub, benchmark methodology (nsys profiling, memory-bound indicators)"
  - name: "Simon Boehm"
    association: "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance (blog: 10 optimization levels from naive to near-cuBLAS), tiling (2D thread-block tiles, register tiles), shared memory bank conflicts (padding, swizzling), warp-level primitives (shuffle, reduce), register blocking (accumulator in registers, outer-product GEMM), coalesced global memory access, double buffering (prefetch next tile while computing current), vectorized loads (float4/int4 loads for bandwidth), loop unrolling strategy, SMEM-to-register copy optimization, thread coarsening, sgemm_kernels GitHub repo"

- name: "Inference Serving Expert"
  short_name: inference-serving
  instructions_file: .github/instructions/inference-serving.instructions.md
  trigger_paths:
  - "crates/braidinfer-runtime/src/model*"
  - "crates/braidinfer-runtime/src/kv_cache*"
  - "crates/braidinfer-runtime/src/scheduler*"
  - "crates/braidinfer-runtime/src/sampler*"
  - "crates/braidinfer-runtime/src/generate*"
  - "crates/braidinfer-runtime/src/chat*"
  - "crates/braidinfer-runtime/src/prefill*"
  experts:
  - name: "Woosuk Kwon"
    association: "vLLM (OSDI 2023: Efficient Memory Management for Large Language Model Serving with PagedAttention), PagedAttention (virtual memory analogy, KV cache as pages, non-contiguous storage, copy-on-write for beam search, eliminates 60-80% memory waste), continuous batching (iteration-level scheduling, no padding waste, dynamic batch composition), KV cache management (block tables, logical-to-physical mapping, memory fragmentation elimination, prefix caching for shared system prompts), speculative decoding integration (draft model scheduling, verification batching, rejection sampling, tree attention for multi-candidate), tensor parallelism (Megatron-style TP, all-reduce placement), pipeline parallelism scheduling (1F1B, interleaved stages, micro-batch scheduling, bubble ratio), disaggregated prefill/decode (Llumnix, separate prefill/decode pools, KV cache transfer), prefix caching (automatic, hash-based, radix tree), chunked prefill (bounded prefill latency, interleave with decode), LoRA serving (S-LoRA, multi-adapter batching), UC Berkeley Sky Computing Lab"
  - name: "Tim Dettmers"
    association: "bitsandbytes (LLM.int8() — emergent outlier features, mixed-precision decomposition, threshold-based FP16 fallback for outlier dimensions), QLoRA (NeurIPS 2023 — NormalFloat4 data type, double quantization, paged optimizers, 4-bit base model + 16-bit LoRA adapters), GPTQ collaboration (post-training quantization, OBQ-based, layer-wise quantization, Hessian-based weight rounding), NF4 (NormalFloat4 — information-theoretically optimal 4-bit data type for normally distributed weights), 8-bit optimizers (block-wise quantization, dynamic exponent), outlier features in transformers (systematic 6-sigma outliers in specific hidden dimensions, must be FP16), The Case for 4-bit Precision blog, k-bit inference scaling laws, mixed-precision training strategies, University of Washington, quantization-aware finetuning"

- name: "Rust Systems Expert"
  short_name: rust-systems
  instructions_file: .github/instructions/rust-systems.instructions.md
  trigger_paths:
  - "crates/braidinfer-core/**"
  - "crates/braidinfer-hip/src/**"
  - "crates/braidinfer-runtime/src/hip_*"
  - "crates/braidinfer-runtime/build.rs"
  - "Cargo.toml"
  - "crates/*/Cargo.toml"
  experts:
  - name: "Jon Gjengset"
    association: "Rust for Rustaceans (book: advanced lifetime elision rules, variance and subtyping, unsafe code contracts, FFI safety patterns, Pin and Unpin mechanics, drop check and PhantomData, orphan rules and coherence, DST and unsized types), Crust of Rust YouTube series (atomics and memory ordering, smart pointers internals, iterators deep dive, channels implementation, async/await state machines, sorting algorithms, dispatch and dyn Trait), unsafe Rust guidelines (safety invariants, validity invariants, stacked borrows model, miri for UB detection, provenance and aliasing), FFI patterns (repr(C), CString/CStr, null pointer optimization, callback patterns, opaque types), Send and Sync across device boundaries (GPU pointer safety, non-Send GPU handles, device affinity), noria database (dataflow materialized views), left-right concurrency (lock-free readers), io_uring Rust bindings (tokio-uring collaboration), MIT PDOS, Amazon, jonghe.nset blog/GitHub"
  - name: "Aria Beingessner (Gankra)"
    association: "The Rustonomicon (official unsafe Rust reference: undefined behavior catalog, drop flags, uninitialized memory, transmute safety rules, PhantomData variance markers, exception safety), You Cant Spell Trust Without Rust (thesis), Learning Rust With Entirely Too Many Linked Lists (book: Box, Rc, Arc, raw pointers, unsafe linked list patterns, miri testing), Cargo/crates.io security work, collections library design (BTreeMap, HashMap internals), type layout and repr (repr(C) vs repr(Rust), padding, alignment, niches), Mozilla Rust evangelism, Oxide Computer Company, cargo-vet (supply chain security)"

