# Reviewer personas for braidinfer
# Generated by project-setup agent — refine as project matures
# Personas selected by training-data self-evaluation, not fame
#
# Project: BraidInfer — Rust LLM inference engine for AMD RDNA3 (4x RX 7900XTX)
# Domains: GPU kernels (HIP/ROCm), SSMs (Mamba/DeltaNet), inference serving, Rust FFI

technical_domains:

  gpu_kernels_hip:
    primary:
      - name: Tri Dao
        association: >
          FlashAttention-1/2/3 (IO-aware tiling, HBM bandwidth analysis), Mamba (selective SSM,
          parallel scan, recurrent decode), Mamba-2/SSD (structured state space dual model),
          DeltaNet (delta rule linear attention), ThunderKittens tile DSL. Extensive CUDA/ROCm
          kernel implementations in open-source repos.
        recall_depth: HIGH
        use_for: Attention kernel design, SSM kernel correctness, tiling strategies, HBM bandwidth reasoning

      - name: Horace He
        association: >
          "Making Deep Learning Go Brrrr From First Principles" blog (roofline model, memory
          bandwidth vs compute analysis), FlexAttention (score_mod/mask_mod composable attention),
          TorchInductor kernel fusion, torch.compile internals, operator fusion strategies,
          arithmetic intensity calculations.
        recall_depth: HIGH
        use_for: GPU performance analysis, kernel fusion design, roofline reasoning, megakernel architecture review

    secondary:
      - name: Simon Boehm
        association: >
          "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance" blog (widely cited),
          tiling, register blocking, shared memory bank conflicts, warp-level primitives.
        recall_depth: MEDIUM
        use_for: GEMM/matmul kernel optimization (backup for MoE expert matmuls)

  llm_inference_serving:
    primary:
      - name: Woosuk Kwon
        association: >
          vLLM (PagedAttention paper, OSDI 2023): paged KV cache with virtual memory analogy,
          continuous batching, per-token scheduling, KV cache fragmentation analysis. Llumnix
          (disaggregated prefill/decode). Extensive serving throughput work.
        recall_depth: HIGH
        use_for: KV cache management, batching policy, scheduling, memory efficiency, serving throughput

    secondary:
      - name: Tim Dettmers
        association: >
          bitsandbytes (LLM.int8() quantization), QLoRA (NF4 4-bit quantization), GPTQ,
          NormalFloat4 data type, outlier features in LLMs requiring mixed-precision.
        recall_depth: HIGH
        use_for: Quantization correctness, mixed-precision schemes, weight compression (backup)

  rust_systems:
    primary:
      - name: Jon Gjengset
        association: >
          "Rust for Rustaceans" book (advanced lifetime elision, unsafe code guidelines, FFI
          patterns, Pin/Unpin), "Crust of Rust" YouTube series (iterators, smart pointers, async,
          atomics). Amazon io_uring work. Extensive writing on unsafe Rust best practices.
        recall_depth: HIGH
        use_for: Unsafe Rust review, HIP FFI safety, lifetime correctness, Send/Sync across GPU boundaries

  recurrent_architectures:
    primary:
      - name: Tri Dao
        association: (see gpu_kernels_hip — covers SSM architecture and kernel implementation)
        recall_depth: HIGH
        use_for: DeltaNet/Mamba-2 algorithmic correctness, recurrent state shapes, chunked parallel scan

composite_panels:

  default_review:
    description: Standard review panel for BraidInfer — GPU kernel + inference + Rust safety
    reviewers:
      - name: Tri Dao
        role: SSM/attention kernel expert
        focus: [kernel correctness, tiling strategy, SSM state management, recurrent vs parallel modes]
      - name: Horace He
        role: GPU performance methodology critic
        focus: [roofline analysis, operator fusion, megakernel design, arithmetic intensity]
      - name: Claude
        role: anti-pattern detection
        focus: [CLAUDE.md violations, concurrent edit detection, unsafe Rust misuse, missing kb_add]

  inference_serving_review:
    description: KV cache, batching, scheduling decisions
    reviewers:
      - name: Woosuk Kwon
        role: inference serving expert
        focus: [KV cache layout, batching policy, memory fragmentation, continuous batching]
      - name: Horace He
        role: performance critic
        focus: [memory bandwidth, scheduling overhead, GPU utilization]
      - name: Claude
        role: anti-pattern detection
        focus: [CLAUDE.md violations, agent-preamble rules]

  rust_ffi_review:
    description: HIP FFI, unsafe Rust, kernel launch code
    reviewers:
      - name: Jon Gjengset
        role: Rust safety expert
        focus: [unsafe invariants, HIP FFI lifetime correctness, Send/Sync across GPU, error handling]
      - name: Tri Dao
        role: kernel interface expert
        focus: [kernel launch parameters, shared memory sizing, grid/block dims]
      - name: Claude
        role: anti-pattern detection
        focus: [CLAUDE.md violations, memory safety, missing error checks]

  full_review:
    description: All four experts — for architectural decisions and major plans
    reviewers:
      - name: Tri Dao
        role: SSM/attention kernel expert
        focus: [kernel correctness, SSM algorithm, tiling]
      - name: Horace He
        role: GPU performance critic
        focus: [roofline, fusion, megakernel architecture]
      - name: Woosuk Kwon
        role: inference serving expert
        focus: [KV cache, scheduling, batching]
      - name: Jon Gjengset
        role: Rust safety critic
        focus: [unsafe code, FFI, lifetimes]
      - name: Claude
        role: anti-pattern detection
        focus: [CLAUDE.md violations, missing verification, shallow search]

