[workspace]
members = [
    "crates/braidinfer-core",
    "crates/braidinfer-hip",
    "crates/braidinfer-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
braidinfer-core = { path = "crates/braidinfer-core" }
braidinfer-hip = { path = "crates/braidinfer-hip" }
